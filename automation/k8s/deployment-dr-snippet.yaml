# Deployment conventions that dr-eks-rollout.sh, Reloader and the runbook rely on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: app
  labels:
    dr.example.com/tier: critical              # selected by DR_SELECTOR
    dr.example.com/restart-order: "2"          # 1 = pgbouncer/proxies, 2 = APIs, 3 = workers/consumers
  annotations:
    secret.reloader.stakater.com/reload: "db-creds"   # Stakater Reloader: rolling restart when the Secret changes
    dr.example.com/prod-replicas: "6"          # capacity to scale to in the DR region (dr-eks-rollout.sh scale)
spec:
  replicas: 1                                  # warm standby in the DR region (GitOps overlay); 6 in primary
  selector:
    matchLabels: { app: app-api }
  template:
    metadata:
      labels: { app: app-api }
    spec:
      containers:
        - name: api
          image: 111122223333.dkr.ecr.eu-central-1.amazonaws.com/app-api:1.2.3   # ECR cross-region replication
          envFrom:
            - secretRef: { name: db-creds }
          env:
            - name: JAVA_TOOL_OPTIONS          # JVM: do not cache DNS forever (stable CNAME must be re-resolved)
              value: "-Dnetworkaddress.cache.ttl=30 -Dnetworkaddress.cache.negative.ttl=5"
            - name: DB_POOL_MAX_LIFETIME_MS    # e.g. HikariCP maxLifetime: pools recycle onto the new primary
              value: "300000"
          readinessProbe:                      # MUST fail when the DB is unreachable or read-only,
            httpGet: { path: /healthz/ready, port: 8080 }   # e.g. runs "SELECT NOT pg_is_in_recovery()"
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:                       # must NOT depend on the DB (avoid restart storms during failover)
            httpGet: { path: /healthz/live, port: 8080 }
            periodSeconds: 20
