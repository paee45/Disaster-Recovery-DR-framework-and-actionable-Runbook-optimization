# External Secrets Operator: syncs the Secrets Manager DB secret into a K8s Secret.
# The secret's `host` is the RDS INSTANCE endpoint; DR cutover (CP-01) rewrites it, ESO syncs it,
# Stakater Reloader rolls every annotated consumer.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:          # IRSA / EKS Pod Identity — read-only on <env>/app/*
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds                      # = K8S_SECRET in env profile
  namespace: app
spec:
  refreshInterval: 1m                 # DR forces it: kubectl annotate externalsecret db-creds force-sync=$(date +%s) --overwrite
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: db-creds
    creationPolicy: Owner
    template:
      data:
        DB_HOST: "{{ .host }}"        # dr-secret-cutover.sh verifies this key after the update
        DB_PORT: "{{ .port }}"
        DB_NAME: "{{ .dbname }}"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: prod/app/db              # = SECRET_ID
---
# Read path (UAT/PROD): points at the read replica in steady state; CP01-S08 repoints it to the primary after S2/S3/S4.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds-ro                   # = K8S_SECRET_RO
  namespace: app
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: db-creds-ro
    creationPolicy: Owner
    template:
      data:
        DB_HOST: "{{ .host }}"
        DB_PORT: "{{ .port }}"
        DB_NAME: "{{ .dbname }}"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: prod/app/db-ro           # = SECRET_ID_RO
