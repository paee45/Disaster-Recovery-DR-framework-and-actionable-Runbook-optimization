# External Secrets Operator: each cluster reads the Secrets Manager secret in ITS OWN region
# (Region B reads the replica secret), so secret sync keeps working when Region A is down.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager-local
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1            # set per cluster by the GitOps overlay (eu-west-1 / eu-central-1)
      auth:
        jwt:
          serviceAccountRef:          # IRSA / EKS Pod Identity, read-only on prod/app/*
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: app
spec:
  refreshInterval: 1m                 # force immediately: kubectl annotate externalsecret db-creds force-sync=$(date +%s) --overwrite
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager-local
  target:
    name: db-creds
    creationPolicy: Owner
    template:
      data:
        # host is the STABLE name (app-pg.db.prod.internal), not an instance endpoint
        DB_HOST: "{{ .host }}"
        DB_PORT: "{{ .port }}"
        DB_NAME: "{{ .dbname }}"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: prod/app/db
