# RPO heartbeat writer (UAT/PROD). Uses the SAME db-creds secret as the app, so after a cutover Reloader moves it to the
# new primary automatically. Logs each committed timestamp; the last logged value before an outage = RPO_LAST_PRIMARY_COMMIT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-heartbeat-writer
  namespace: app
  labels:
    app: dr-heartbeat-writer
    dr.example.com/db-consumer: "true"
    dr.example.com/restart-order: "3"
  annotations:
    secret.reloader.stakater.com/reload: "db-creds"
spec:
  replicas: 1
  selector:
    matchLabels: { app: dr-heartbeat-writer }
  template:
    metadata:
      labels: { app: dr-heartbeat-writer }
    spec:
      containers:
        - name: writer
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: db-creds }      # app user needs INSERT/UPDATE/SELECT on dr.heartbeat (00-heartbeat.sql)
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PGHOST=$DB_HOST PGUSER=$DB_USER PGPASSWORD=$DB_PASSWORD PGDATABASE=$DB_NAME PGCONNECT_TIMEOUT=3 PGSSLMODE=require
              while true; do
                ts=$(psql -XAtqc "INSERT INTO dr.heartbeat(id, ts) VALUES (1, clock_timestamp())
                     ON CONFLICT (id) DO UPDATE SET ts = EXCLUDED.ts RETURNING ts" 2>&1) \
                  && echo "{\"heartbeat_commit\":\"$ts\"}" \
                  || echo "{\"heartbeat_error\":\"$(echo $ts | tr -d '\"')\"}"
                sleep 1
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
