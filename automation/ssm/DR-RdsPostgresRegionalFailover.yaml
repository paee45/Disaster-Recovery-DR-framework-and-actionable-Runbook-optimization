description: |
  ## DR-RdsPostgresRegionalFailover
  RB-DR-RDS-001 Phase 2 automation: pre-check → approval gate G2 → promote cross-region read replica →
  wait until standalone → repoint the stable private CNAME to the new primary.
  Deploy this document in the **DR region** (and the primary region for failback) via IaC.
  Fencing (P2-S01/S02) and EKS recovery (Phase 3) are separate steps, because they may target an impaired region.
schemaVersion: '0.3'
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: AWS::IAM::Role::Arn
    description: DR automation role (rds:PromoteReadReplica, rds:Describe*, route53:ChangeResourceRecordSets, cloudwatch:GetMetricStatistics)
  DrDbInstanceId:
    type: String
    description: Cross-region read replica to promote (in this region)
  HostedZoneId:
    type: String
    description: Private hosted zone containing the stable DB CNAME
  RecordName:
    type: String
    description: Stable DB DNS name, e.g. app-pg.db.prod.internal
  RecordTtl:
    type: Integer
    default: 30
  BackupRetentionDays:
    type: Integer
    default: 7
  RpoSeconds:
    type: Integer
    default: 300
  DrId:
    type: String
    description: Incident / drill ID, stamped into change comments for traceability
  Approvers:
    type: StringList
    description: IAM users/roles allowed to approve gate G2 (IC + DBA)
  MinRequiredApprovals:
    type: Integer
    default: 2
mainSteps:
  - name: PreCheck
    action: aws:executeScript
    timeoutSeconds: 120
    onFailure: Abort
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        db: '{{ DrDbInstanceId }}'
        rpo: '{{ RpoSeconds }}'
      Script: |
        import boto3, datetime
        def handler(event, context):
            rds = boto3.client('rds'); cw = boto3.client('cloudwatch')
            i = rds.describe_db_instances(DBInstanceIdentifier=event['db'])['DBInstances'][0]
            if i['DBInstanceStatus'] != 'available':
                raise Exception(f"replica status {i['DBInstanceStatus']} != available")
            source = i.get('ReadReplicaSourceDBInstanceIdentifier')
            if not source:
                raise Exception('instance is not a read replica (already promoted?)')
            now = datetime.datetime.utcnow()
            dps = cw.get_metric_statistics(Namespace='AWS/RDS', MetricName='ReplicaLag',
                    Dimensions=[{'Name': 'DBInstanceIdentifier', 'Value': event['db']}],
                    StartTime=now - datetime.timedelta(minutes=15), EndTime=now,
                    Period=60, Statistics=['Maximum'])['Datapoints']
            lag = max([d['Maximum'] for d in dps], default=-1)
            return {'source': source, 'maxLag15m': lag,
                    'lagWithinRpo': (0 <= lag <= int(event['rpo'])),
                    'checkedAt': now.isoformat() + 'Z'}
    outputs:
      - Name: Source
        Selector: $.Payload.source
        Type: String
      - Name: MaxLag15m
        Selector: $.Payload.maxLag15m
        Type: Integer
      - Name: LagWithinRpo
        Selector: $.Payload.lagWithinRpo
        Type: Boolean

  - name: GateG2PointOfNoReturn
    action: aws:approve
    timeoutSeconds: 3600
    onFailure: Abort
    inputs:
      # Optional: NotificationArn: <SNS topic> to push the approval request to chat (AWS Chatbot / Amazon Q Developer in chat)
      Message: |
        [{{ DrId }}] GATE G2 — POINT OF NO RETURN.
        Promote {{ DrDbInstanceId }} (source {{ PreCheck.Source }}). ReplicaLag max 15m = {{ PreCheck.MaxLag15m }}s,
        within RPO = {{ PreCheck.LagWithinRpo }}. Confirm fencing status and the final LSN capture (P2-S05) before approving.
      MinRequiredApprovals: '{{ MinRequiredApprovals }}'
      Approvers: '{{ Approvers }}'

  - name: PromoteReplica
    action: aws:executeAwsApi
    onFailure: Abort
    inputs:
      Service: rds
      Api: PromoteReadReplica
      DBInstanceIdentifier: '{{ DrDbInstanceId }}'
      BackupRetentionPeriod: '{{ BackupRetentionDays }}'

  - name: WaitUntilStandalone
    action: aws:executeScript
    timeoutSeconds: 1800
    onFailure: Abort
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        db: '{{ DrDbInstanceId }}'
      Script: |
        import boto3, time
        def handler(event, context):
            # Do not trust status alone: right after the call the instance can still be 'available' with a source set.
            rds = boto3.client('rds')
            while True:
                i = rds.describe_db_instances(DBInstanceIdentifier=event['db'])['DBInstances'][0]
                if i['DBInstanceStatus'] == 'available' and not i.get('ReadReplicaSourceDBInstanceIdentifier'):
                    return {'endpoint': i['Endpoint']['Address'], 'status': i['DBInstanceStatus']}
                time.sleep(15)
    outputs:
      - Name: Endpoint
        Selector: $.Payload.endpoint
        Type: String

  - name: RepointStableCname
    action: aws:executeAwsApi
    onFailure: Abort
    inputs:
      Service: route53
      Api: ChangeResourceRecordSets
      HostedZoneId: '{{ HostedZoneId }}'
      ChangeBatch:
        Comment: 'DR {{ DrId }} via SSM {{ automation:EXECUTION_ID }}'
        Changes:
          - Action: UPSERT
            ResourceRecordSet:
              Name: '{{ RecordName }}'
              Type: CNAME
              TTL: '{{ RecordTtl }}'
              ResourceRecords:
                - Value: '{{ WaitUntilStandalone.Endpoint }}'
    outputs:
      - Name: ChangeId
        Selector: $.ChangeInfo.Id
        Type: String

  - name: WaitDnsInSync
    action: aws:waitForAwsResourceProperty
    timeoutSeconds: 300
    onFailure: Abort
    inputs:
      Service: route53
      Api: GetChange
      Id: '{{ RepointStableCname.ChangeId }}'
      PropertySelector: $.ChangeInfo.Status
      DesiredValues:
        - INSYNC
    isEnd: true
outputs:
  - PreCheck.MaxLag15m
  - WaitUntilStandalone.Endpoint
  - RepointStableCname.ChangeId
