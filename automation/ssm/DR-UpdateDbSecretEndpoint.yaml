description: |
  ## DR-UpdateDbSecretEndpoint
  CP-01 (AWS side): point a Secrets Manager DB secret at a DB instance's endpoint.
  Updates host, port and dbInstanceIdentifier (if present) and keeps the previous version as AWSPREVIOUS (rollback).
  The Kubernetes side (ESO force-sync + Reloader rollout wait) is run by the executor: dr-secret-cutover.sh / dr-eks-rollout.sh.
  Never returns secret values.
schemaVersion: '0.3'
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: AWS::IAM::Role::Arn
  SecretId:
    type: String
  DbInstanceId:
    type: String
    description: Instance whose endpoint the secret must point to (promoted replica / restored instance)
  DrId:
    type: String
mainSteps:
  - name: UpdateSecret
    action: aws:executeScript
    timeoutSeconds: 120
    onFailure: Abort
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        secret_id: '{{ SecretId }}'
        db: '{{ DbInstanceId }}'
        dr_id: '{{ DrId }}'
      Script: |
        import boto3, json
        def handler(event, context):
            rds = boto3.client('rds'); sm = boto3.client('secretsmanager')
            inst = rds.describe_db_instances(DBInstanceIdentifier=event['db'])['DBInstances'][0]
            if inst['DBInstanceStatus'] != 'available' or inst.get('ReadReplicaSourceDBInstanceIdentifier'):
                raise Exception(f"{event['db']} is not a standalone available instance: {inst['DBInstanceStatus']}")
            ep = inst['Endpoint']
            meta = sm.describe_secret(SecretId=event['secret_id'])
            prev = next(v for v, st in meta['VersionIdsToStages'].items() if 'AWSCURRENT' in st)
            cur = json.loads(sm.get_secret_value(SecretId=event['secret_id'])['SecretString'])
            old_host = cur.get('host')
            cur['host'], cur['port'] = ep['Address'], ep['Port']
            if 'dbInstanceIdentifier' in cur:
                cur['dbInstanceIdentifier'] = event['db']
            new = sm.put_secret_value(SecretId=event['secret_id'], SecretString=json.dumps(cur))
            return {'previousVersion': prev, 'newVersion': new['VersionId'], 'oldHost': old_host, 'newHost': ep['Address']}
    outputs:
      - Name: PreviousVersion
        Selector: $.Payload.previousVersion
        Type: String
      - Name: NewVersion
        Selector: $.Payload.newVersion
        Type: String
      - Name: NewHost
        Selector: $.Payload.newHost
        Type: String
outputs:
  - UpdateSecret.PreviousVersion
  - UpdateSecret.NewVersion
  - UpdateSecret.NewHost
