description: |
  ## DR-UpdateDbSecretEndpoint
  CP-01 (AWS side): point a Secrets Manager DB secret at a DB instance's endpoint.
  Updates host, port and dbInstanceIdentifier (if present) and keeps the previous version as AWSPREVIOUS (rollback).
  The Kubernetes side (ESO force-sync + Reloader rollout wait) is run by the executor: dr-secret-cutover.sh / dr-eks-rollout.sh.
  BB3 mode previews both endpoint changes, requires exact secret-name/ARN confirmation,
  and rejects source-endpoint or version mismatches. Never returns credential values.
schemaVersion: '0.3'
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: AWS::IAM::Role::Arn
  SecretId:
    type: String
  DbInstanceId:
    type: String
    description: Instance whose endpoint the secret must point to (promoted replica / restored instance)
  DrId:
    type: String
  EndpointSchema:
    type: String
    default: legacy
    allowedValues: [legacy, bb3]
  SourceDbInstanceId:
    type: String
    default: ''
  SourceReplicaId:
    type: String
    default: ''
  ReplicaDbInstanceId:
    type: String
    default: ''
  ExpectedVersionId:
    type: String
    default: ''
  ConfirmSecretId:
    type: String
    default: ''
  Apply:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
mainSteps:
  - name: UpdateSecret
    action: aws:executeScript
    timeoutSeconds: 120
    onFailure: Abort
    isEnd: true
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        secret_id: '{{ SecretId }}'
        db: '{{ DbInstanceId }}'
        dr_id: '{{ DrId }}'
        schema: '{{ EndpointSchema }}'
        source_db: '{{ SourceDbInstanceId }}'
        source_replica: '{{ SourceReplicaId }}'
        replica: '{{ ReplicaDbInstanceId }}'
        expected_version: '{{ ExpectedVersionId }}'
        confirmed_secret: '{{ ConfirmSecretId }}'
        apply: '{{ Apply }}'
      Script: |
        import boto3, json, uuid

        def bb3_update(event, rds, sm):
          def instance(identifier):
            if not identifier:
              raise ValueError('All four BB3 database IDs are required.')
            result = rds.describe_db_instances(DBInstanceIdentifier=identifier)['DBInstances'][0]
            if result.get('Engine') != 'postgres' or result.get('DBInstanceStatus') != 'available':
              raise ValueError('Every BB3 database must be available PostgreSQL.')
            return result

          identifiers = [event.get(key) for key in ('source_db', 'source_replica', 'db', 'replica')]
          if len(set(identifiers)) != 4:
            raise ValueError('Source and target database IDs must be distinct.')
          source, source_replica, target, replica = [instance(identifier) for identifier in identifiers]
          for writer, reader in ((source, source_replica), (target, replica)):
            if writer.get('ReadReplicaSourceDBInstanceIdentifier'):
              raise ValueError('Primary must not be a read replica.')
            if reader.get('ReadReplicaSourceDBInstanceIdentifier') != writer['DBInstanceIdentifier']:
              raise ValueError('Replica does not belong to the expected primary.')
          meta = sm.describe_secret(SecretId=event['secret_id'])
          if meta.get('DeletedDate') or meta.get('RotationEnabled'):
            raise ValueError('Deleted or automatically rotating secrets require a separate procedure.')
          current = [version for version, stages in meta['VersionIdsToStages'].items() if 'AWSCURRENT' in stages]
          if len(current) != 1:
            raise ValueError('Expected exactly one AWSCURRENT version.')
          previous = current[0]
          response = sm.get_secret_value(SecretId=meta['ARN'], VersionId=previous, VersionStage='AWSCURRENT')
          try:
            secret = json.loads(response['SecretString'])
          except (KeyError, TypeError, ValueError):
            raise ValueError('Secret must be a JSON string object.') from None
          if not isinstance(secret, dict):
            raise ValueError('Secret must be a JSON object.')
          old_hosts = (source['Endpoint']['Address'], source_replica['Endpoint']['Address'])
          if (secret.get('DB_HOST'), secret.get('DB_REPLICA_HOST')) != old_hosts:
            raise ValueError('Secret endpoints do not match BOTH source databases. No update made.')
          new_hosts = (target['Endpoint']['Address'], replica['Endpoint']['Address'])
          result = {'previousVersion': previous, 'newVersion': previous,
                'oldHost': old_hosts[0], 'newHost': new_hosts[0],
                'oldReplicaHost': old_hosts[1], 'newReplicaHost': new_hosts[1],
                'secretName': meta['Name'], 'secretArn': meta['ARN'], 'applied': False}
          if event.get('apply', 'false') != 'true':
            return result
          if event.get('confirmed_secret') not in (meta['Name'], meta['ARN']):
            raise ValueError('Confirm the exact secret name or full ARN before updating.')
          if event.get('expected_version') != previous:
            raise ValueError('Secret version changed or preview version was not supplied. Preview again.')
          secret['DB_HOST'], secret['DB_REPLICA_HOST'] = new_hosts
          token = str(uuid.uuid4())
          stage = 'DR-endpoint-' + token
          new = sm.put_secret_value(SecretId=meta['ARN'], ClientRequestToken=token,
                        VersionStages=[stage], SecretString=json.dumps(secret))
          sm.update_secret_version_stage(SecretId=meta['ARN'], VersionStage='AWSCURRENT',
                           MoveToVersionId=new['VersionId'], RemoveFromVersionId=previous)
          result.update(newVersion=new['VersionId'], applied=True)
          return result

        def handler(event, context):
          rds = boto3.client('rds'); sm = boto3.client('secretsmanager')
          if event.get('schema') == 'bb3':
            result = bb3_update(event, rds, sm)
            result['summary'] = json.dumps(result)
            return result
          inst = rds.describe_db_instances(DBInstanceIdentifier=event['db'])['DBInstances'][0]
          if inst['DBInstanceStatus'] != 'available' or inst.get('ReadReplicaSourceDBInstanceIdentifier'):
            raise Exception(f"{event['db']} is not a standalone available instance: {inst['DBInstanceStatus']}")
          ep = inst['Endpoint']
          meta = sm.describe_secret(SecretId=event['secret_id'])
          prev = next(v for v, st in meta['VersionIdsToStages'].items() if 'AWSCURRENT' in st)
          cur = json.loads(sm.get_secret_value(SecretId=event['secret_id'])['SecretString'])
          old_host = cur.get('host')
          cur['host'], cur['port'] = ep['Address'], ep['Port']
          if 'dbInstanceIdentifier' in cur:
            cur['dbInstanceIdentifier'] = event['db']
          new = sm.put_secret_value(SecretId=event['secret_id'], SecretString=json.dumps(cur))
          result = {'previousVersion': prev, 'newVersion': new['VersionId'], 'oldHost': old_host, 'newHost': ep['Address']}
          result['summary'] = '{}'
          return result
    outputs:
      - Name: PreviousVersion
        Selector: $.Payload.previousVersion
        Type: String
      - Name: NewVersion
        Selector: $.Payload.newVersion
        Type: String
      - Name: NewHost
        Selector: $.Payload.newHost
        Type: String
      - Name: Summary
        Selector: $.Payload.summary
        Type: String
outputs:
  - UpdateSecret.PreviousVersion
  - UpdateSecret.NewVersion
  - UpdateSecret.NewHost
  - UpdateSecret.Summary
