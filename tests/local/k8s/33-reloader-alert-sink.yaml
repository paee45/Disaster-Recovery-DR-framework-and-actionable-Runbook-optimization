# Receives Reloader's "reloaded" alerts (ALERT_ON_RELOAD=true, ALERT_WEBHOOK_URL → this service) and prints each
# request to its log, standing in for a Slack/Teams/Google Chat webhook in the local test.
apiVersion: apps/v1
kind: Deployment
metadata: { name: reloader-alert-sink, namespace: reloader, labels: { app: reloader-alert-sink } }
spec:
  replicas: 1
  selector: { matchLabels: { app: reloader-alert-sink } }
  template:
    metadata: { labels: { app: reloader-alert-sink } }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: sink
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            # nc -lk -e: persistent server, one handler process per connection. (A `while nc -l` loop serves one request
            # at a time and drops alerts that arrive together — Reloader sends one per restarted workload.)
            - |
              cat > /tmp/handler.sh <<'H'
              #!/bin/sh
              len=0; cr="$(printf '\r')"
              while IFS= read -r l; do l="${l%"$cr"}"; [ -z "$l" ] && break
                case "$l" in [Cc]ontent-[Ll]ength:*) len="${l#*: }" ;; esac; done
              body="$(head -c "$len")"
              printf '%s\n--- end of request\n' "$body" > /proc/1/fd/1
              printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok'
              H
              chmod +x /tmp/handler.sh
              exec nc -lk -p 8080 -e /tmp/handler.sh
          ports: [ { containerPort: 8080 } ]
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: reloader-alert-sink, namespace: reloader }
spec:
  selector: { app: reloader-alert-sink }
  ports: [ { port: 8080, targetPort: 8080 } ]
