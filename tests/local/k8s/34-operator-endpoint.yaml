apiVersion: v1
kind: Secret
metadata:
  name: app-db-endpoint
  namespace: app
type: Opaque
stringData:
  POSTGRES_DB_HOST1: "172.30.0.21"
  POSTGRES_DB_HOST2: "172.30.0.21"
  POSTGRES_DB_PORT: "5432"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-operator
  namespace: app
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-operator-endpoint
  namespace: app
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-db-endpoint"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dr-endpoint-ledger-app-db-endpoint"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-operator-endpoint
  namespace: app
subjects:
  - kind: ServiceAccount
    name: dr-operator
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dr-operator-endpoint
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-operator-identity
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dr-cluster-identity"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-operator-identity
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: dr-operator
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dr-operator-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dr-local-operator-inventory
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-local-operator-inventory
subjects:
  - kind: ServiceAccount
    name: dr-operator
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-local-operator-inventory