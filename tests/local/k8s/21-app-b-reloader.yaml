apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-b
  namespace: app
  labels:
    app: app-b
    dr.example.com/db-consumer: "true"
    dr.example.com/restart-order: "1"
  annotations:
    secret.reloader.stakater.com/reload: "app-db-credentials"
spec:
  replicas: 1
  serviceName: app-b
  selector: { matchLabels: { app: app-b } }
  template:
    metadata:
      labels: { app: app-b }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom: [ { secretRef: { name: app-db-credentials } } ]
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Sample DB client: holds a session visible in pg_stat_activity as application_name=app-b.
              # DB_HOST is read ONCE at start (like a real app) → only a restart moves it to a new endpoint.
              echo "start host=$POSTGRES_DB_HOST"
              while true; do
                PGPASSWORD="$POSTGRES_DB_PASSWORD" psql "host=$POSTGRES_DB_HOST port=$POSTGRES_DB_PORT dbname=$POSTGRES_DB_NAME user=$POSTGRES_DB_USER sslmode=disable connect_timeout=3 application_name=app-b" \
                  -XAtqc "select pg_sleep(30)" >/dev/null 2>&1 || { echo "db error on $POSTGRES_DB_HOST"; sleep 2; }
              done
          resources: { requests: { cpu: 5m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: app-b, namespace: app }
spec: { clusterIP: None, selector: { app: app-b }, ports: [ { port: 80 } ] }
