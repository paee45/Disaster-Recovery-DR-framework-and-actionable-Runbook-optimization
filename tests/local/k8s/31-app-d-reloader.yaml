apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-d
  namespace: app
  labels:
    app: app-d
    dr.example.com/db-consumer: "true"
    dr.example.com/restart-order: "2"
  annotations:
    secret.reloader.stakater.com/reload: "app-db-direct"
spec:
  replicas: 1
  selector: { matchLabels: { app: app-d } }
  template:
    metadata:
      labels: { app: app-d }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom: [ { secretRef: { name: app-db-direct } } ]
          command: ["/bin/sh", "-c"]
          args:
            - |
              # reads POSTGRES_DB_HOST1 ONCE at start (like a real app); session visible as application_name=direct-d
              echo "start host=$POSTGRES_DB_HOST1"
              while true; do
                PGPASSWORD="$POSTGRES_DB_PASSWORD" psql "host=$POSTGRES_DB_HOST1 port=$POSTGRES_DB_PORT dbname=$POSTGRES_DB_NAME user=$POSTGRES_DB_USER sslmode=disable connect_timeout=3 application_name=direct-d" \
                  -XAtqc "select pg_sleep(30)" >/dev/null 2>&1 || { echo "db error on $POSTGRES_DB_HOST1"; sleep 2; }
              done
          resources: { requests: { cpu: 5m, memory: 16Mi } }
