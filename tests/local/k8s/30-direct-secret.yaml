# SECRET_MODE=k8s test: a PLAIN Kubernetes Secret (no ESO) with TWO host keys that must always get the same endpoint.
# Test-only credentials (same as the seeded local Postgres containers).
apiVersion: v1
kind: Secret
metadata:
  name: app-db-direct
  namespace: app
type: Opaque
stringData:
  POSTGRES_DB_HOST1: "172.30.0.21"
  POSTGRES_DB_HOST2: "172.30.0.21"
  POSTGRES_DB_PORT: "5432"
  POSTGRES_DB_NAME: app
  POSTGRES_DB_USER: app_user
  POSTGRES_DB_PASSWORD: apppw-current
